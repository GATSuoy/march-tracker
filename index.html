<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MARCH STATES</title>
<style>
 * { box-sizing: border-box; }
 body {
 margin: 0;
 font-family: 'Segoe UI', Tahoma, Arial, sans-serif;
 background: #1c1c1e;
 color: #fff;
 display: flex;
 justify-content: center;
 padding: 16px;
 min-height: 100vh;
 }
 .app { width: 100%; max-width: 440px; }
 h1 {
 font-size: 18px;
 text-align: center;
 margin: 4px 0 16px;
 color: #ccc;
 font-weight: 600;
 }
 .card {
 background: #2c2c2e;
 border-radius: 16px;
 padding: 16px;
 margin-bottom: 14px;
 box-shadow: 0 8px 24px rgba(0,0,0,0.35);
 }
 label {
 display: block;
 font-size: 13px;
 color: #aaa;
 margin-bottom: 5px;
 }
 input[type="text"], input[type="number"] {
 width: 100%;
 padding: 10px 11px;
 border-radius: 10px;
 border: 1px solid #3a3a3c;
 background: #1c1c1e;
 color: #fff;
 font-size: 16px;
 margin-bottom: 10px;
 }
 input:focus { outline: none; border-color: #0a84ff; }
 input::placeholder { color: #666; opacity: 1; }
 input[readonly] { color: #9ecbff; background: #1a1a1c; }
 input.name-duplicate { border-color: #ff453a; }

 select {
 width: 100%;
 padding: 10px 11px;
 border-radius: 10px;
 border: 1px solid #3a3a3c;
 background: #1c1c1e;
 color: #fff;
 font-size: 16px;
 margin-bottom: 10px;
 }
 select:focus { outline: none; border-color: #0a84ff; }
 .preset-select option[value=""] { color: #666; }
 .preset-select.is-placeholder { color: #666; }
 .preset-select { color: #fff; }

 .preset-search-wrap { position: relative; margin-bottom: 10px; }
 .preset-search-row { display: flex; gap: 6px; align-items: center; }
 .preset-search-input {
 flex: 1;
 min-width: 0;
 padding: 10px 11px;
 border-radius: 10px;
 border: 1px solid #3a3a3c;
 background: #1c1c1e;
 color: #fff;
 font-size: 16px;
 margin-bottom: 0;
 }
 .preset-search-input:focus { outline: none; border-color: #0a84ff; }
 .preset-filter-wrap { position: relative; flex-shrink: 0; }
 .preset-filter-btn {
 width: 32px;
 height: 32px;
 flex-shrink: 0;
 padding: 0;
 border-radius: 8px;
 border: 1px solid #3a3a3c;
 background: #2c2c2e;
 color: #999;
 display: flex;
 align-items: center;
 justify-content: center;
 cursor: pointer;
 }
 .preset-filter-btn.active { border-color: #0a84ff; color: #0a84ff; }
 .preset-filter-menu {
 display: none;
 position: absolute;
 top: calc(100% + 4px);
 left: 0;
 min-width: 100px;
 background: #232325;
 border: 1px solid #3a3a3c;
 border-radius: 10px;
 z-index: 31;
 box-shadow: 0 8px 24px rgba(0,0,0,0.4);
 overflow: hidden;
 }
 .preset-filter-menu.show { display: block; }
 .preset-filter-item {
 padding: 9px 12px;
 font-size: 13px;
 color: #fff;
 cursor: pointer;
 border-bottom: 1px solid #2c2c2e;
 }
 .preset-filter-item:last-child { border-bottom: none; }
 .preset-filter-item:active { background: #2c2c2e; }
 .preset-search-list {
 display: none;
 position: absolute;
 top: calc(100% + 4px);
 left: 0;
 right: 0;
 max-height: 200px;
 overflow-y: auto;
 background: #232325;
 border: 1px solid #3a3a3c;
 border-radius: 10px;
 z-index: 30;
 box-shadow: 0 8px 24px rgba(0,0,0,0.4);
 }
 .preset-search-list.show { display: block; }
 .preset-search-item {
 padding: 10px 12px;
 font-size: 14px;
 color: #fff;
 cursor: pointer;
 border-bottom: 1px solid #2c2c2e;
 }
 .preset-search-item:last-child { border-bottom: none; }
 .preset-search-item:active { background: #2c2c2e; }
 .preset-search-empty {
 padding: 10px 12px;
 font-size: 13px;
 color: #666;
 }

 .stats-grid {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 10px 12px;
 }
 .stat-block.attack label { color: #ff3b30; }
 .stat-block.defense label { color: #0a84ff; }
 .stat-block.health label { color: #34c759; }
 .stat-block.speed label { color: #ff9f0a; }
 .stat-block.dmgup label { color: #ff375f; }
 .stat-block.dmgdown label { color: #32d74b; }

 .btn {
 width: 100%;
 padding: 13px;
 border: none;
 border-radius: 10px;
 background: #0a84ff;
 color: #fff;
 font-size: 16px;
 font-weight: 700;
 cursor: pointer;
 margin-top: 4px;
 }
 .btn:active { background: #0968cc; }

 .btn-cancel {
 width: 100%;
 padding: 11px;
 border: 1px solid #555;
 border-radius: 10px;
 background: none;
 color: #aaa;
 font-size: 14px;
 cursor: pointer;
 margin-top: 8px;
 }

 .btn-delete-selected {
 padding: 0 14px;
 border: 1px solid #ff453a;
 border-radius: 10px;
 background: none;
 color: #ff453a;
 font-size: 13px;
 font-weight: 700;
 cursor: pointer;
 white-space: nowrap;
 }

 .btn-save-preset {
 padding: 0 12px;
 border: 1px solid #64d2ff;
 border-radius: 10px;
 background: none;
 color: #64d2ff;
 font-size: 12px;
 font-weight: 700;
 cursor: pointer;
 white-space: nowrap;
 }

 .btn-next {
 width: 100%;
 padding: 11px;
 border: none;
 border-radius: 10px;
 background: #232325;
 color: #64d2ff;
 font-size: 14px;
 font-weight: 700;
 cursor: pointer;
 margin-top: 10px;
 }

 .nav-row {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 8px;
 margin-top: 10px;
 }
 .nav-row.nav-row-single {
 grid-template-columns: 1fr;
 }
 .nav-row .btn-next, .nav-row .btn-prev {
 margin-top: 0;
 }
 .btn-prev {
 width: 100%;
 padding: 11px;
 border: none;
 border-radius: 10px;
 background: #232325;
 color: #999;
 font-size: 14px;
 font-weight: 700;
 cursor: pointer;
 }

 .section-title {
 font-size: 13px;
 color: #888;
 margin: 6px 0 10px;
 padding-top: 10px;
 border-top: 1px solid #3a3a3c;
 }

 .section-total-box {
 background: #1c1c1e;
 border: 1px solid #3a3a3c;
 border-radius: 12px;
 padding: 10px 12px 4px;
 margin-top: 4px;
 }

 .gear-item {
 background: #232325;
 border-radius: 12px;
 padding: 10px 10px 2px;
 margin-bottom: 10px;
 }
 .gear-name {
 font-size: 14px;
 color: #64d2ff;
 font-weight: 700;
 margin-bottom: 8px;
 }
 .gear-item .stats-grid { gap: 8px 10px; }
 .gear-item input[type="number"] {
 padding: 8px 9px;
 font-size: 14px;
 margin-bottom: 8px;
 }
 .gear-item .stat-block label { font-size: 11px; margin-bottom: 3px; }
 .gear-item .pct-field input[type="number"] { margin-bottom: 0; }
 .value-chance {
 display: flex;
 gap: 6px;
 }
 .value-chance > * {
 width: 50%;
 }
 .value-chance > .pct-field:only-child {
 width: 100%;
 }
 .value-chance >input {
 margin-bottom: 8px;
 }
 .pct-field {
 display: flex;
 align-items: center;
 gap: 4px;
 margin-bottom: 8px;
 }
 .pct-field input {
 flex: 1;
 min-width: 0;
 margin-bottom: 0;
 }
 .pct-suffix {
 color: #666;
 font-size: 12px;
 flex-shrink: 0;
 }

 .list { margin-top: 4px; }
 .char {
 background: #2c2c2e;
 border-radius: 14px;
 padding: 14px;
 margin-bottom: 10px;
 }
 .char-head {
 display: flex;
 justify-content: space-between;
 align-items: center;
 margin-bottom: 10px;
 }
 .char-name { font-size: 17px; font-weight: 700; }
 .commander-badge {
 font-size: 11px;
 font-weight: 600;
 color: #ffd60a;
 background: #ffd60a22;
 padding: 2px 8px;
 border-radius: 6px;
 margin-right: 6px;
 }
 .char-total {
 font-size: 15px;
 font-weight: 700;
 color: #0a84ff;
 background: #0a84ff22;
 padding: 4px 10px;
 border-radius: 8px;
 }
 .char-del {
 background: none;
 border: none;
 color: #ff453a;
 font-size: 15px;
 cursor: pointer;
 margin-right: 8px;
 }
 .char-edit {
 background: none;
 border: none;
 color: #64d2ff;
 font-size: 15px;
 cursor: pointer;
 margin-right: 8px;
 }
 .char-stats {
 display: grid;
 grid-template-columns: repeat(3, 1fr);
 gap: 6px;
 }
 .char-stats .mini .k { font-size: 10px; }
 .mini {
 background: #1c1c1e;
 border-radius: 8px;
 padding: 6px 4px;
 text-align: center;
 }
 .mini .k { font-size: 11px; color: #888; }
 .mini .v { font-size: 15px; font-weight: 700; }
 .mini .chc { font-size: 10px; color: #666; margin-top: 1px; white-space: nowrap; overflow: hidden; display: block; }
 .mini.attack .v { color: #ff3b30; }
 .mini.defense .v { color: #0a84ff; }
 .mini.health .v { color: #34c759; }
 .mini.speed .v { color: #ff9f0a; }
 .mini.dmgup .v { color: #ff375f; }
 .mini.dmgdown .v { color: #32d74b; }

 .toggle-gear {
 width: 100%;
 background: none;
 border: none;
 color: #64d2ff;
 font-size: 13px;
 text-align: center;
 padding: 8px 0 2px;
 cursor: pointer;
 }
 .char-gear-list { display: none; margin-top: 8px; }
 .char-gear-list.open { display: block; }
 .gear-row {
 background: #1c1c1e;
 border-radius: 10px;
 padding: 8px 10px;
 margin-bottom: 6px;
 }
 .gear-row-name {
 font-size: 13px;
 color: #64d2ff;
 font-weight: 700;
 margin-bottom: 6px;
 }
 .gear-row-stats {
 display: grid;
 grid-template-columns: repeat(3, 1fr);
 gap: 5px;
 }
 .gear-row-stats .mini { padding: 4px 2px; }
 .gear-row-stats .mini .k { font-size: 10px; }
 .gear-row-stats .mini .v { font-size: 12px; }

 .section-detail {
 margin-bottom: 14px;
 padding-bottom: 10px;
 border-bottom: 1px solid #3a3a3c;
 }
 .section-detail:last-child {
 border-bottom: none;
 margin-bottom: 0;
 padding-bottom: 0;
 }
 .section-detail-title {
 font-size: 13px;
 font-weight: 700;
 color: #64d2ff;
 margin-bottom: 6px;
 }
 .section-detail-items {
 margin-top: 6px;
 opacity: 0.85;
 display: none;
 }
 .char-gear-list.show-items .section-detail-items {
 display: block;
 }
 .toggle-items {
 width: 100%;
 background: none;
 border: 1px dashed #444;
 border-radius: 8px;
 color: #888;
 font-size: 12px;
 text-align: center;
 padding: 6px 0;
 margin-top: 4px;
 cursor: pointer;
 }

 .btn-add-inscription {
 width: 100%;
 padding: 12px;
 border: 1px dashed #64d2ff;
 border-radius: 10px;
 background: none;
 color: #64d2ff;
 font-size: 14px;
 font-weight: 700;
 cursor: pointer;
 margin-bottom: 12px;
 }
 #inscriptionContainer .gear-item.inscription-hidden {
 display: none;
 }

 .empty {
 text-align: center;
 color: #777;
 padding: 20px 0;
 font-size: 14px;
 }

 .tabs {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 6px;
 margin: 4px 0 14px;
 }
 .tab-btn {
 padding: 10px 2px;
 border: none;
 border-radius: 10px;
 background: #232325;
 color: #999;
 font-size: 12px;
 font-weight: 700;
 cursor: pointer;
 }
 .tab-btn.active {
 background: #0a84ff;
 color: #fff;
 }
 .tab-content { display: none; }

 .mode-toggle {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 6px;
 margin-bottom: 14px;
 }
 .mode-btn {
 padding: 10px 4px;
 border: none;
 border-radius: 10px;
 background: #232325;
 color: #999;
 font-size: 13px;
 font-weight: 700;
 cursor: pointer;
 }
 .mode-btn.active {
 background: #64d2ff;
 color: #1c1c1e;
 }
 .dmgtype-toggle {
 display: grid;
 grid-template-columns: 1fr 1fr 1fr 64px;
 gap: 6px;
 margin-bottom: 10px;
 align-items: stretch;
 }
 .dmgtype-btn {
 height: 38px;
 padding: 0 4px;
 border: 2px solid #3a3a3c;
 border-radius: 10px;
 background: #2c2c2e;
 color: #ccc;
 font-size: 11px;
 font-weight: 600;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 4px;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
 }
 .dmgtype-btn.active {
 border-color: #ff9f0a;
 color: #fff;
 background: #2c2c2e;
 }
 .dmg-amount-input {
 height: 38px;
 width: 100%;
 min-width: 0;
 padding: 0 4px;
 border-radius: 10px;
 border: 2px solid #3a3a3c;
 background: #2c2c2e;
 color: #fff;
 font-size: 13px;
 text-align: center;
 }
 .dmg-amount-input:focus { outline: none; border-color: #ff9f0a; }

 .unittype-toggle {
 display: grid;
 grid-template-columns: 1fr 1fr 1fr 1fr;
 gap: 6px;
 margin-bottom: 10px;
 }
 .unittype-btn {
 height: 38px;
 padding: 0 4px;
 border: 2px solid #3a3a3c;
 border-radius: 10px;
 background: #2c2c2e;
 color: #ccc;
 font-size: 11px;
 font-weight: 600;
 cursor: pointer;
 display: flex;
 align-items: center;
 justify-content: center;
 gap: 4px;
 white-space: nowrap;
 overflow: hidden;
 text-overflow: ellipsis;
 }
 .unittype-btn .unittype-icon { width: 16px; height: 16px; object-fit: contain; flex-shrink: 0; }
 .unittype-btn.active {
 border-color: #34c759;
 color: #fff;
 background: #2c2c2e;
 }
 .tab-content.active { display: block; }

 .page-nav {
 display: grid;
 grid-template-columns: 1fr 1fr;
 gap: 8px;
 margin-bottom: 14px;
 }
 .page-nav-btn {
 padding: 12px 4px;
 border: none;
 border-radius: 12px;
 background: #232325;
 color: #999;
 font-size: 14px;
 font-weight: 700;
 cursor: pointer;
 }
 .page-nav-btn.active {
 background: #ffd60a;
 color: #1c1c1e;
 }
 .page { display: none; }
 .page.active { display: block; }

 .summary-table {
 width: 100%;
 border-collapse: collapse;
 font-size: 12px;
 white-space: nowrap;
 }
 .summary-table th, .summary-table td {
 padding: 8px 10px;
 text-align: center;
 }
 .summary-table th {
 color: #888;
 font-weight: 600;
 border-bottom: 1px solid #3a3a3c;
 }
 .summary-table td {
 border-bottom: 1px solid #232325;
 }
 .summary-table td:first-child, .summary-table th:first-child {
 text-align: right;
 color: #64d2ff;
 font-weight: 700;
 }

 /* تنسيق مخصص لشاشات أكبر مثل الآيباد عند فتح الصفحة في سفاري */
 @media (min-width: 768px) {
 body { padding: 32px; align-items: flex-start; }
 .app { max-width: 760px; }
 h1 { font-size: 22px; }
 .stats-grid { grid-template-columns: repeat(3, 1fr); }
 .char-stats { grid-template-columns: repeat(6, 1fr); }
 .gear-item .stats-grid { grid-template-columns: repeat(3, 1fr); }
 .card { padding: 20px; }
 .btn, .btn-cancel, .btn-next, .btn-prev { font-size: 16px; }
 }

 @media (min-width: 1024px) {
 .app { max-width: 880px; }
 }
</style>
</head>
<body>
<div class="app">
 <h1>MARCH STATES</h1>

 <div class="page-nav">
 <button class="page-nav-btn active" id="pageBtn-input" onclick="switchPage('input')">الإدخال</button>
 <button class="page-nav-btn" id="pageBtn-review" onclick="switchPage('review')">الاستعراض</button>
 </div>

 <div class="page active" id="page-input">
 <div class="card" id="editSelectorCard" style="display:none;">
 <label>تعديل مسيرة محفوظة</label>
 <div style="display:flex; gap:8px;">
 <select id="editSelector" onchange="onEditSelectorChange()" style="flex:1; margin-bottom:0;">
 <option value="new">مسيرة جديدة</option>
 </select>
 <button class="btn-delete-selected" id="deleteEditSelectedBtn" onclick="deleteEditSelectedMarch()" style="display:none;">حذف</button>
 </div>
 </div>
 <div class="card" id="inputFormCard">
 <label>March</label>
 <input type="text" id="marchName" placeholder="" readonly>

 <div class="tabs">
 <button class="tab-btn active" id="tabBtn-commanders" onclick="switchTab('commanders')">القادة</button>
 <button class="tab-btn" id="tabBtn-gear" onclick="switchTab('gear')">المعدات</button>
 <button class="tab-btn" id="tabBtn-formation" onclick="switchTab('formation')">التشكيل</button>
 <button class="tab-btn" id="tabBtn-inscriptions" onclick="switchTab('inscriptions')">النقوش</button>
 </div>

 <div class="tab-content active" id="tab-commanders">
 <div id="commanderContainer"></div>
 <div class="section-total-box">
 <div class="section-title" style="border-top:none; padding-top:0; margin-top:0;">Skills</div>
 <div class="char-stats" id="totals-commanders"></div>
 </div>
 <div class="nav-row nav-row-single">
 <button class="btn-next" onclick="switchTab('gear')">التالي: المعدات ▶</button>
 </div>
 </div>

 <div class="tab-content" id="tab-gear">
 <div class="mode-toggle">
 <button type="button" class="mode-btn active" id="modeBtn-gear-total" onclick="setGearMode('total')">Total</button>
 <button type="button" class="mode-btn" id="modeBtn-gear-details" onclick="setGearMode('details')">Details</button>
 </div>

 <div class="section-total-box">
 <div class="stats-grid" id="gearTotalInputs"></div>
 </div>
 <div id="gearContainer"></div>
 <div class="nav-row">
 <button class="btn-prev" onclick="switchTab('commanders')">◀ السابق: القادة</button>
 <button class="btn-next" onclick="switchTab('formation')">التالي: التشكيل ▶</button>
 </div>
 </div>

 <div class="tab-content" id="tab-formation">
 <label>نوع التشكيل</label>
 <select id="formationType">
 <option value="اختر" selected>اختر</option>
 <option value="القوس">القوس</option>
 <option value="الوتد">الوتد</option>
 <option value="دلتا">دلتا</option>
 <option value="الكماشة">الكماشة</option>
 </select>

 <div class="mode-toggle">
 <button type="button" class="mode-btn active" id="modeBtn-total" onclick="setFormationMode('total')">Total</button>
 <button type="button" class="mode-btn" id="modeBtn-details" onclick="setFormationMode('details')">Details</button>
 </div>

 <div class="section-total-box">
 <div class="stats-grid" id="formationTotalInputs"></div>
 </div>
 <div id="formationContainer"></div>
 <div class="nav-row">
 <button class="btn-prev" onclick="switchTab('gear')">◀ السابق: المعدات</button>
 <button class="btn-next" onclick="switchTab('inscriptions')">التالي: النقوش ▶</button>
 </div>
 </div>

 <div class="tab-content" id="tab-inscriptions">
 <button type="button" class="btn-add-inscription" id="addInscriptionBtn" onclick="addInscriptionSlot()">إضافة نقش</button>
 <div id="inscriptionContainer"></div>
 <div class="section-total-box">
 <div class="char-stats" id="totals-inscriptions"></div>
 </div>
 <div class="nav-row nav-row-single">
 <button class="btn-prev" onclick="switchTab('formation')">◀ السابق: التشكيل</button>
 </div>
 </div>

 <button class="btn" id="submitBtn" onclick="addCharacter()">حفظ</button>
 <button class="btn-cancel" id="reviewBtn" onclick="switchPage('review')">استعرض</button>
 <button class="btn-cancel" id="cancelBtn" onclick="cancelEdit()" style="display:none;">إلغاء التعديل</button>
 </div>
 </div>

 <div class="page" id="page-review">
 <div class="card" id="livePreviewCard">
 <div class="section-title" style="border-top:none; padding-top:0; margin-top:0;">Current Stats</div>
 <div class="char-stats" id="livePreviewStats"></div>
 <button class="toggle-gear" onclick="toggleGear('live')">عرض تفاصيل الأقسام ▾</button>
 <div class="char-gear-list" id="gearlist-live">
 <button class="toggle-items" onclick="toggleItems('live')">إظهار عناصر كل قسم ▾</button>
 <div id="livePreviewDetails"></div>
 </div>
 </div>
 <div class="card" id="selectorCard" style="display:none;">
 <label>اختر المسيرة لاستعراض إحصائيتها</label>
 <div style="display:flex; gap:8px;">
 <select id="marchSelector" onchange="filterByMarch()" style="flex:1; margin-bottom:0;">
 <option value="all">عرض الكل</option>
 </select>
 <button class="btn-delete-selected" id="deleteSelectedBtn" onclick="deleteSelectedMarch()" style="display:none;">حذف</button>
 </div>
 </div>
 <div class="card" id="summaryCard" style="display:none;">
 <div class="section-title" style="border-top:none; padding-top:0; margin-top:0;">مقارنة سريعة</div>
 <div style="overflow-x:auto;">
 <table class="summary-table" id="summaryTable"></table>
 </div>
 </div>
 <div class="list" id="list">
 <div class="empty" id="emptyMsg">لا توجد مسيرات مضافة بعد</div>
 </div>
 </div>
</div>

<script>
// تعريف كل خانة إحصائية ممكنة: المعرف، التسمية، الأيقونة، الصنف اللوني
const STAT_DEFS = {
 attack: { key: "attack", label: "ATK", cls: "attack" },
 defense: { key: "defense", label: "DEF", cls: "defense" },
 health: { key: "health", label: "HP", cls: "health" },
 speed: { key: "speed", label: "SPD", cls: "speed" },
 dmgup: { key: "dmgUp", label: "+DMG", cls: "dmgup" },
 dmgdown: { key: "dmgDown", label: "-DMG", cls: "dmgdown" }
};

 });
}

// قائمة القادة المحفوظين (اسم + إحصائيات) لإعادة استخدامها لاحقًا بدل إعادة الكتابة
let savedCommanders = [];

function buildCommanderPresetUI(g, statKeys) {
 const wrap = document.createElement('div');
 wrap.className = 'preset-search-wrap';
 wrap.id = g.id + '_presetWrap';
 wrap.innerHTML = `
 <div class="preset-search-row">
 <input type="text" id="${g.id}_presetSearch" class="preset-search-input" placeholder="اختر" autocomplete="off">
 <div class="preset-filter-wrap" id="${g.id}_presetFilterWrap">
 <button type="button" class="preset-filter-btn" id="${g.id}_presetFilterBtn" data-value="">
 <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"></polygon></svg>
 </button>
 <div class="preset-filter-menu" id="${g.id}_presetFilterMenu">
 <div class="preset-filter-item" data-value="">الكل</div>
 <div class="preset-filter-item" data-value="infantry">Infa</div>
 <div class="preset-filter-item" data-value="archers">Arch</div>
 <div class="preset-filter-item" data-value="cavalry">Cav</div>
 <div class="preset-filter-item" data-value="engineering">Eng</div>
 </div>
 </div>
 </div>
 <div class="preset-search-list" id="${g.id}_presetList"></div>
 `;
 document.getElementById(g.id + '_name').insertAdjacentElement('beforebegin', wrap);

 const input = wrap.querySelector('.preset-search-input');
 const filterBtn = wrap.querySelector('.preset-filter-btn');
 const filterMenu = wrap.querySelector('.preset-filter-menu');
 const list = wrap.querySelector('.preset-search-list');
 input.addEventListener('input', () =>renderCommanderPresetList(g.id));
 input.addEventListener('focus', () =>renderCommanderPresetList(g.id));
 filterBtn.addEventListener('click', e => {
 e.stopPropagation();
 filterMenu.classList.toggle('show');
 });
 filterMenu.addEventListener('click', e => {
 const item = e.target.closest('.preset-filter-item');
 if (!item) return;
 const value = item.dataset.value;
 filterBtn.dataset.value = value;
 filterBtn.classList.toggle('active', !!value);
 filterMenu.classList.remove('show');
 renderCommanderPresetList(g.id);
 });
 list.addEventListener('click', e => {
 const item = e.target.closest('.preset-search-item');
 if (!item || !item.dataset.name) return;
 selectCommanderFromSearch(g.id, item.dataset.name);
 });
}

commanderTypes.forEach(g =>buildCommanderPresetUI(g, commanderStatKeys));

// يغلق قائمة نتائج البحث وقائمة الفلترة عند الضغط خارجهما
document.addEventListener('click', e => {
 commanderTypes.forEach(g => {
 const wrap = document.getElementById(g.id + '_presetWrap');
 if (wrap && !wrap.contains(e.target)) {
 const list = document.getElementById(g.id + '_presetList');
 if (list) list.classList.remove('show');
 const filterMenu = document.getElementById(g.id + '_presetFilterMenu');
 if (filterMenu) filterMenu.classList.remove('show');
 }
 });
});

function escapeHtml(str) {
 return String(str).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// يعرض قائمة القادة المحفوظين المطابقين لما كُتب في خانة البحث ونوع الوحدة المختار
function renderCommanderPresetList(id) {
 const input = document.getElementById(id + '_presetSearch');
 const filterBtn = document.getElementById(id + '_presetFilterBtn');
 const list = document.getElementById(id + '_presetList');
 if (!input || !list) return;
 const q = input.value.trim().toLowerCase();
 const unitType = filterBtn ? filterBtn.dataset.value : '';
 const matches = savedCommanders.filter(p => {
 const matchesQuery = !q || p.name.toLowerCase().includes(q);
 const matchesType = !unitType || p.unitType === unitType;
 return matchesQuery && matchesType;
 });
 if (matches.length === 0) {
 list.innerHTML = '<div class="preset-search-empty">لا نتائج</div>';
 } else {
 list.innerHTML = matches.map(p =>`<div class="preset-search-item" data-name="${escapeHtml(p.name)}">${escapeHtml(p.name)}</div>`).join('');
 }
 list.classList.add('show');
}

// يعبّي بيانات القائد المختار من نتائج البحث في خانات الإدخال
function selectCommanderFromSearch(id, name) {
 const preset = savedCommanders.find(p =>p.name === name);
 if (!preset) return;

 const input = document.getElementById(id + '_presetSearch');
 const list = document.getElementById(id + '_presetList');
 if (input) input.value = name;
 if (list) list.classList.remove('show');

 document.getElementById(id + '_name').value = preset.name;
 if (preset.damageType) selectDamageType(id, preset.damageType);
 if (preset.unitType) selectUnitType(id, preset.unitType);
 const dmgAmountEl = document.getElementById(id + '_dmgAmount');
 if (dmgAmountEl) dmgAmountEl.value = preset.damageAmount || "";
 commanderStatKeys.forEach(k => {
 document.getElementById(id + '_' + k).value = preset[STAT_DEFS[k].key];
 document.getElementById(id + '_' + k + '_chance').value = preset[STAT_DEFS[k].key + 'Chance'];
 });

 updateMarchNameFromCommanders();
 renderAllSectionTotals();
}

// يحفظ (أو يحدّث) بيانات القائد في قائمة القادة المحفوظين
function autoSaveCommanderPreset(id) {
 const nameEl = document.getElementById(id + '_name');
 const name = nameEl.value.trim();
 if (!name) { nameEl.classList.remove('name-duplicate'); return; }

 const searchInput = document.getElementById(id + '_presetSearch');
 const existingIdx = savedCommanders.findIndex(p =>p.name === name);

 // امنع حفظ الاسم إذا كان مستخدمًا مسبقًا لقائد محفوظ آخر غير المحدد حاليًا في هذه الخانة
 if (existingIdx !== -1 && (!searchInput || searchInput.value !== name)) {
 nameEl.classList.add('name-duplicate');
 return;
 }
 nameEl.classList.remove('name-duplicate');

 const dmgTypeEl = document.getElementById(id + '_dmgtype');
 const unitTypeEl = document.getElementById(id + '_unittype');
 const preset = {
 name,
 damageType: dmgTypeEl ? (dmgTypeEl.dataset.value || null) : null,
 damageAmount: num(id + '_dmgAmount') || null,
 unitType: unitTypeEl ? (unitTypeEl.dataset.value || null) : null
 };
 commanderStatKeys.forEach(k => {
 preset[STAT_DEFS[k].key] = num(id + '_' + k);
 preset[STAT_DEFS[k].key + 'Chance'] = num(id + '_' + k + '_chance');
 });

 if (existingIdx !== -1) savedCommanders[existingIdx] = preset;
 else savedCommanders.push(preset);

 renderCommanderPresetSelectors();
 // نحافظ على القائد المختار حاليًا في خانة البحث كما هو بعد التحديث
 if (searchInput) searchInput.value = name;
}

function renderCommanderPresetSelectors() {
 saveToStorage();
}

function updateMarchNameFromCommanders() {
 const main = document.getElementById('mainCmd_name').value.trim();
 const sub = document.getElementById('subCmd_name').value.trim();
 let combined = "";
 if (main && sub) combined = main + " / " + sub;
 else if (main) combined = main;
 else if (sub) combined = sub;
 document.getElementById('marchName').value = combined;
}

document.getElementById('mainCmd_name').addEventListener('input', updateMarchNameFromCommanders);
document.getElementById('subCmd_name').addEventListener('input', updateMarchNameFromCommanders);

// صندوق "مجموع المعدات": يُحسب تلقائيًا من تفاصيل القطع الست تحته،
// لكن أي خانة يدخلها المستخدم يدويًا تبقى كما كتبها ولا يتم الكتابة فوقها تلقائيًا
const gearTotalManual = {};

(function buildGearTotalInputs() {
 const el = document.getElementById('gearTotalInputs');
 el.innerHTML = fullStatKeys.map(k => {
 const d = STAT_DEFS[k];
 return `
 <div class="stat-block ${d.cls}">
 <label>${d.label}</label>
 <div class="pct-field">
 <input type="number" id="gearTotal_${k}" placeholder="0">
 <span class="pct-suffix">%</span>
 </div>
 </div>`;
 }).join('');

 fullStatKeys.forEach(k => {
 const input = document.getElementById('gearTotal_' + k);
 input.addEventListener('input', () => {
 gearTotalManual[k] = input.value !== "";
 });
 });
})();

let gearMode = 'details';

function setGearMode(mode) {
 gearMode = mode;
 document.getElementById('modeBtn-gear-details').classList.toggle('active', mode === 'details');
 document.getElementById('modeBtn-gear-total').classList.toggle('active', mode === 'total');
 document.getElementById('gearContainer').style.display = (mode === 'details') ? 'block' : 'none';

 const totalInputs = fullStatKeys.map(k =>document.getElementById('gearTotal_' + k));
 if (mode === 'total') {
 totalInputs.forEach(inp =>inp.readOnly = false);
 fullStatKeys.forEach(k =>gearTotalManual[k] = true);
 } else {
 totalInputs.forEach(inp =>inp.readOnly = true);
 fullStatKeys.forEach(k =>gearTotalManual[k] = false);
 renderGearTotalInputs();
 }
}

// طقم معدات جاهز (Codex Helper)، بحسب نوع الوحدات: مشاة / رماة / فرسان
// (Siege Defense +3% غير مدرجة لعدم وجود فئة "حصار" في البرنامج، وMarch Speed +10% مشتركة بين الأنواع)
const EQUIPMENT_LOADOUT_BY_UNIT = {
 infantry: { attack: 47, defense: 29, health: 0, speed: 10, dmgup: 0, dmgdown: 0 },
 archers: { attack: 5, defense: 13, health: 4, speed: 10, dmgup: 0, dmgdown: 0 },
 cavalry: { attack: 8, defense: 6, health: 3, speed: 10, dmgup: 0, dmgdown: 0 }
};

// يعبّي صندوق "مجموع المعدات" تلقائيًا حسب نوع وحدات القائد الأساسي (Primary)
function applyEquipmentLoadoutForMainCommander() {
 const wrap = document.getElementById('mainCmd_unittype');
 const unitType = wrap ? wrap.dataset.value : null;
 const loadout = EQUIPMENT_LOADOUT_BY_UNIT[unitType];
 if (!loadout) return;

 setGearMode('total');
 fullStatKeys.forEach(k => {
 const input = document.getElementById('gearTotal_' + k);
 if (input) {
 input.value = loadout[k];
 gearTotalManual[k] = true;
 }
 });
 renderAllSectionTotals();

// نظام عام لحفظ واختيار عناصر محفوظة (معدات/تشكيل/نقوش)، بنفس أسلوب القادة
// المعدات والتشكيل: لكل قطعة (سلاح/خوذة/.../مخطوطة/معدة/...) مكتبتها الخاصة
// النقوش: مكتبة واحدة مشتركة بين كل خانات النقش الثمانية (لأنها متطابقة الدور)
const savedPresets = {};
const FIELD_STAT_KEYS = {};
const FIELD_POOL = {};

function getPool(poolKey) {
 if (!savedPresets[poolKey]) savedPresets[poolKey] = [];
 return savedPresets[poolKey];
}

function buildGenericPresetUI(g, poolKey) {
 const wrap = document.createElement('div');
 wrap.style.marginBottom = '10px';
 wrap.innerHTML = `
 <select id="${g.id}_preset" class="preset-select is-placeholder" style="margin-bottom:0;" onchange="applyGenericPreset('${g.id}')">
 <option value="" disabled selected>اختر</option>
 </select>
 `;
 document.getElementById(g.id + '_name').insertAdjacentElement('beforebegin', wrap);
}

const autoSaveTimers = {};

function scheduleAutoSaveGeneric(id) {
 clearTimeout(autoSaveTimers[id]);
 autoSaveTimers[id] = setTimeout(() =>autoSaveGenericPreset(id), 600);
}

function autoSaveGenericPreset(id) {
 const statKeys = FIELD_STAT_KEYS[id];
 const poolKey = FIELD_POOL[id];
 const name = document.getElementById(id + '_name').value.trim();
 if (!name) return;

 const preset = { name };
 statKeys.forEach(k => {
 preset[STAT_DEFS[k].key] = num(id + '_' + k);
 preset[STAT_DEFS[k].key + 'Chance'] = num(id + '_' + k + '_chance');
 });

 const pool = getPool(poolKey);
 const existingIdx = pool.findIndex(p =>p.name === name);
 if (existingIdx !== -1) pool[existingIdx] = preset;
 else pool.push(preset);

 renderGenericPresetSelector(id);
 document.getElementById(id + '_preset').value = name;
}

function applyGenericPreset(id) {
 const selector = document.getElementById(id + '_preset');
 const name = selector.value;
 if (!name) return;
 const statKeys = FIELD_STAT_KEYS[id];
 const pool = getPool(FIELD_POOL[id]);
 const preset = pool.find(p =>p.name === name);
 if (!preset) return;

 selector.classList.remove('is-placeholder');

 document.getElementById(id + '_name').value = preset.name;
 statKeys.forEach(k => {
 document.getElementById(id + '_' + k).value = preset[STAT_DEFS[k].key];
 const chanceEl = document.getElementById(id + '_' + k + '_chance');
 if (chanceEl) chanceEl.value = preset[STAT_DEFS[k].key + 'Chance'];
 });

 renderAllSectionTotals();
}

function renderGenericPresetSelector(id) {
 const selector = document.getElementById(id + '_preset');
 if (!selector) return;
 const pool = getPool(FIELD_POOL[id]);
 const prevValue = selector.value;
 selector.innerHTML = '<option value="" disabled>اختر</option>' +
 pool.map(p => `<option value="${p.name}">${p.name}</option>`).join('');
 const stillExists = pool.some(p =>p.name === prevValue);
 selector.value = stillExists ? prevValue : "";
 selector.classList.toggle('is-placeholder', !stillExists);
 saveToStorage();
}

function setupGenericPresets(types, statKeys, poolKeyFn) {
 types.forEach(g => {
 const poolKey = poolKeyFn(g);
 FIELD_STAT_KEYS[g.id] = statKeys;
 FIELD_POOL[g.id] = poolKey;
 buildGenericPresetUI(g, poolKey);

 const fieldIds = [g.id + '_name', ...statKeys.flatMap(k => [g.id + '_' + k, g.id + '_' + k + '_chance'])];
 fieldIds.forEach(fid => {
 const el = document.getElementById(fid);
 if (el) el.addEventListener('input', () =>scheduleAutoSaveGeneric(g.id));
 });
 });
}

setupGenericPresets(gearTypes, fullStatKeys, g =>g.id);
setupGenericPresets(formationTypes, fullStatKeys, g =>g.id);
setupGenericPresets(inscriptionTypes, fullStatKeys, () => "inscriptions");

const SECTION_LABELS = {
 attack: "ATK", defense: "DEF", health: "HP",
 speed: "SPD", dmgup: "+DMG", dmgdown: "-DMG"
};

function computeSectionTotal(types, statKeys) {
 const totals = {};
 statKeys.forEach(k =>totals[k] = 0);
 types.forEach(g => {
 statKeys.forEach(k => {
 totals[k] += num(g.id + '_' + k);
 });
 });
 return totals;
}

function computeSectionChanceTotal(types, statKeys) {
 const totals = {};
 statKeys.forEach(k =>totals[k] = 0);
 types.forEach(g => {
 statKeys.forEach(k => {
 totals[k] += num(g.id + '_' + k + '_chance');
 });
 });
 return totals;
}

function renderSectionTotalBox(elId, types, statKeys, chanceOnly) {
 const el = document.getElementById(elId);
 if (!el) return;
 const chanceTotals = computeSectionChanceTotal(types, statKeys);
 if (chanceOnly) {
 el.innerHTML = statKeys.map(k => {

 return `<div class="mini ${d.cls}"><div class="k">${SECTION_LABELS[k]}</div><div class="v">${chanceTotals[k]}</div></div>`;

 return;

 el.innerHTML = statKeys.map(k => {

 return `<div class="mini ${d.cls}"><div class="k">${SECTION_LABELS[k]}</div><div class="v">${totals[k]}</div><div class="chc">CHC: ${chanceTotals[k]}</div></div>`;
 }).join('');
}

// حفظ دائم في localStorage — يبقى البيانات موجودة حتى بعد إغلاق الصفحة أو تحديثها
const STORAGE_KEY = 'marchTracker_v1';

function saveToStorage() {
 try {
 localStorage.setItem(STORAGE_KEY, JSON.stringify({
 characters,
 savedCommanders,
 savedPresets
 }));
 } catch (e) {
 console.warn('تعذر الحفظ الدائم:', e);
 }
}

function loadFromStorage() {
 try {
 const raw = localStorage.getItem(STORAGE_KEY);
 if (!raw) return;
 const data = JSON.parse(raw);
 if (Array.isArray(data.characters)) characters = data.characters;
 if (Array.isArray(data.savedCommanders)) savedCommanders = data.savedCommanders;
 if (data.savedPresets && typeof data.savedPresets === 'object') {
 Object.keys(savedPresets).forEach(k =>delete savedPresets[k]);
 Object.assign(savedPresets, data.savedPresets);
 }
 } catch (e) {
 console.warn('تعذر تحميل البيانات المحفوظة:', e);
 }
}

function num(id) {
 const el = document.getElementById(id);
 return el ? (parseFloat(el.value) || 0) : 0;
}

// يجمع بيانات مجموعة عناصر (قادة/معدات/تشكيل/نقوش) من الحقول، ويضيف مساهمتها لمجاميع المسيرة
function collectItems(types, statKeys, totals) {
 return types.map(g => {
 const dmgTypeEl = document.getElementById(g.id + '_dmgtype');
 const dmgAmountEl = document.getElementById(g.id + '_dmgAmount');
 const unitTypeEl = document.getElementById(g.id + '_unittype');
 const item = {
 label: g.label,
 name: document.getElementById(g.id + '_name').value.trim() || "—",
 damageType: dmgTypeEl ? (dmgTypeEl.dataset.value || null) : null,
 damageAmount: dmgAmountEl ? (num(g.id + '_dmgAmount') || null) : null,
 unitType: unitTypeEl ? (unitTypeEl.dataset.value || null) : null
 };
 statKeys.forEach(k => {
 const d = STAT_DEFS[k];
 const val = num(g.id + '_' + k);
 const chance = num(g.id + '_' + k + '_chance');
 item[d.key] = val;
 item[d.key + 'Chance'] = chance;
 totals[d.key] += val;
 });
 return item;
 });
}

 if (unitTypeEl) {

 unitTypeEl.querySelectorAll('.unittype-btn').forEach(btn => btn.classList.remove('active'));
 }
 });
 Object.keys(STAT_DEFS).forEach(k => {
 [...commanderTypes, ...gearTypes, ...formationTypes, ...inscriptionTypes].forEach(g => {
 const el = document.getElementById(g.id + '_' + k);
 if (el) el.value = "";

 [...commanderTypes, ...gearTypes, ...formationTypes, ...inscriptionTypes].forEach(g => {

 presetEl.value = "";

 });
 fullStatKeys.forEach(k => {

 setGearMode('total');

function buildRecordFromForm() {
 const totals = { attack: 0, defense: 0, health: 0, speed: 0, dmgUp: 0, dmgDown: 0 };

 const commanders = collectItems(commanderTypes, commanderStatKeys, totals);
 const gearDummyTotals = { attack: 0, defense: 0, health: 0, speed: 0, dmgUp: 0, dmgDown: 0 };
 const gear = collectItems(gearTypes, fullStatKeys, gearDummyTotals);
 const formationsDummyTotals = { attack: 0, defense: 0, health: 0, speed: 0, dmgUp: 0, dmgDown: 0 };
 const formations = collectItems(formationTypes, fullStatKeys, formationsDummyTotals);
 const inscriptions = collectItems(inscriptionTypes, fullStatKeys, totals);

 // مجموع المعدات يُؤخذ من الصندوق العلوي مباشرة (سواء محسوب تلقائيًا أو مدخل يدويًا)
 const gearTotals = {};
 const gearManualState = {};
 fullStatKeys.forEach(k => {
 const d = STAT_DEFS[k];
 const val = num('gearTotal_' + k);
 gearTotals[d.key] = val;
 gearManualState[k] = !!gearTotalManual[k];
 totals[d.key] += val;
 });

 // مجموع التشكيل يُؤخذ من الصندوق العلوي مباشرة (سواء محسوب تلقائيًا أو مدخل يدويًا)
 const formationTotals = {};
 const formationManualState = {};
 fullStatKeys.forEach(k => {
 const d = STAT_DEFS[k];
 const val = num('formTotal_' + k);
 formationTotals[d.key] = val;
 formationManualState[k] = !!formationTotalManual[k];
 totals[d.key] += val;
 });

 const formationType = document.getElementById('formationType').value;
 const marchName = document.getElementById('marchName').value.trim() || "بدون اسم";

 const total = totals.attack + totals.defense + totals.health + totals.speed + totals.dmgUp + totals.dmgDown;

 return {
 commanders, gear, formations, inscriptions, formationType, marchName,
 gearTotals, gearManualState, gearMode,
 formationTotals, formationManualState, formationMode,
 attack: totals.attack, defense: totals.defense, health: totals.health,
 speed: totals.speed, dmgUp: totals.dmgUp, dmgDown: totals.dmgDown,
 total
 };
}

function renderItemRows(items, statKeys) {

 const DMG_TYPE_LABELS = { skill: 'مهارة', kill: 'ضربة قاضية', group: 'هجوم مجموعة' };
 const UNIT_TYPE_LABELS = { infantry: 'Infa', archers: 'Arch', cavalry: 'Cav', engineering: 'Eng' };

 const dmgAmountLabel = g.damageAmount ? ` - ${g.damageAmount}` : '';
 const unitTypeLabel = g.unitType ? (UNIT_TYPE_LABELS[g.unitType] || g.unitType) : '';

 return `

 { k: 'health', label: 'HP' },
 { k: 'speed', label: 'SPD' },
 { k: 'dmgUp', label: '+DMG' },
 { k: 'dmgDown', label: '-DMG' },
 { k: 'total', label: 'المجموع' }
 ];

 let html = '<tr><th>مسيرة</th>' + cols.map(c => `<th>${c.label}</th>`).join('') + '</tr>';
 characters.forEach((c, i) => {
 html += `<tr><td>${c.marchName}</td>` + cols.map(c2 => `<td>${c[c2.k]}</td>`).join('') + '</tr>';
 });
 table.innerHTML = html;
}

function computeItemsSubtotal(items, statKeys) {
 const totals = {};
 statKeys.forEach(k =>totals[k] = 0);
 items.forEach(item => {
 statKeys.forEach(k => {
 totals[k] += item[STAT_DEFS[k].key] || 0;
 });
 });
 return totals;
}

function renderSectionDetail(title, totals, statKeys, itemRowsHtml) {
 const totalsHtml = statKeys.map(k => {
 const d = STAT_DEFS[k];
 return `<div class="mini ${d.cls}"><div class="k">${SECTION_LABELS[k]}</div><div class="v">${totals[k]}</div></div>`;
 }).join('');
 return `
 <div class="section-detail">
 <div class="section-detail-title">${title}</div>
 <div class="char-stats">${totalsHtml}</div>
 <div class="section-detail-items">${itemRowsHtml}</div>
 </div>`;
}

function renderList() {
 const list = document.getElementById('list');
 list.innerHTML = "";

 saveToStorage();
 renderSummaryTable();
 renderMarchSelector();
 renderEditSelector();

 if (characters.length === 0) {
 list.innerHTML = '<div class="empty">لا توجد مسيرات مضافة بعد</div>';
 return;
 }

 characters.forEach((c, i) => {
 const div = document.createElement('div');
 div.className = 'char';
 div.dataset.marchIndex = i;

 const commanderRows = renderItemRows(c.commanders, commanderStatKeys);
 const gearRows = renderItemRows(c.gear, fullStatKeys);
 const addedFormations = c.formations.filter(it => it.name !== "—");
 const formationRows = renderItemRows(addedFormations, fullStatKeys);
 const addedInscriptions = c.inscriptions.filter(it => it.name !== "—");
 const inscriptionRows = renderItemRows(addedInscriptions, fullStatKeys);

 const commanderSubtotal = computeItemsSubtotal(c.commanders, commanderStatKeys);
 const gearSubtotal = c.gearTotals ? {
 attack: c.gearTotals.attack, defense: c.gearTotals.defense, health: c.gearTotals.health,
 speed: c.gearTotals.speed, dmgup: c.gearTotals.dmgUp, dmgdown: c.gearTotals.dmgDown
 } : computeItemsSubtotal(c.gear, fullStatKeys);
 const formationSubtotal = c.formationTotals ? {
 attack: c.formationTotals.attack, defense: c.formationTotals.defense, health: c.formationTotals.health,
 speed: c.formationTotals.speed, dmgup: c.formationTotals.dmgUp, dmgdown: c.formationTotals.dmgDown
 } : computeItemsSubtotal(c.formations, fullStatKeys);
 const inscriptionSubtotal = computeItemsSubtotal(addedInscriptions, fullStatKeys);

 div.innerHTML = `
 <div class="char-head">
 <span class="char-name">${c.marchName} <span class="commander-badge">${c.formationType}</span></span>
 <div>
 <span class="char-total">المجموع: ${c.total}</span>
 <button class="char-edit" onclick="editCharacter(${i})"></button>
 <button class="char-del" onclick="removeCharacter(${i})"></button>
 </div>
 </div>
 <div class="section-title" style="border-top:none; padding-top:0; margin-top:0;">Full Stats</div>
 <div class="char-stats">
 <div class="mini attack"><div class="k">ATK</div><div class="v">${c.attack}</div></div>
 <div class="mini defense"><div class="k">DEF</div><div class="v">${c.defense}</div></div>
 <div class="mini health"><div class="k">HP</div><div class="v">${c.health}</div></div>
 <div class="mini speed"><div class="k">SPD</div><div class="v">${c.speed}</div></div>
 <div class="mini dmgup"><div class="k">+DMG</div><div class="v">${c.dmgUp}</div></div>
 <div class="mini dmgdown"><div class="k">-DMG</div><div class="v">${c.dmgDown}</div></div>
 </div>
 <button class="toggle-gear" onclick="toggleGear(${i})">عرض تفاصيل الأقسام ▾</button>
 <div class="char-gear-list" id="gearlist-${i}">
 <button class="toggle-items" onclick="toggleItems(${i})">إظهار عناصر كل قسم ▾</button>
 ${renderSectionDetail('Skills', commanderSubtotal, commanderStatKeys, commanderRows)}
 ${renderSectionDetail('المعدات', gearSubtotal, fullStatKeys, gearRows)}
 ${addedFormations.length ? renderSectionDetail('التشكيل', formationSubtotal, fullStatKeys, formationRows) : ''}
 ${addedInscriptions.length ? renderSectionDetail('النقوش', inscriptionSubtotal, fullStatKeys, inscriptionRows) : ''}
 </div>
 `;
 list.appendChild(div);
 });

 filterByMarch();
}

function renderMarchSelector() {
 const card = document.getElementById('selectorCard');
 const selector = document.getElementById('marchSelector');

 if (characters.length === 0) {
 card.style.display = "none";
 return;
 }
 card.style.display = "block";

 const prevValue = selector.value;
 selector.innerHTML = '<option value="all">عرض الكل</option>' +
 characters.map((c, i) => `<option value="${i}">${c.marchName}</option>`).join('');

 const stillExists = [...selector.options].some(o =>o.value === prevValue);
 selector.value = stillExists ? prevValue : "all";
}

function filterByMarch() {
 const selector = document.getElementById('marchSelector');
 const val = selector ? selector.value : "all";
 document.querySelectorAll('#list .char').forEach(el => {
 el.style.display = (val === "all" || el.dataset.marchIndex === val) ? "block" : "none";
 });
 document.getElementById('deleteSelectedBtn').style.display = (val === "all") ? "none" : "inline-block";
}

function deleteSelectedMarch() {
 const selector = document.getElementById('marchSelector');
 const val = selector.value;
 if (val === "all") return;
 const index = parseInt(val, 10);
 removeCharacter(index);
}

function renderEditSelector() {
 const card = document.getElementById('editSelectorCard');
 const selector = document.getElementById('editSelector');

 if (characters.length === 0) {
 card.style.display = "none";
 selector.innerHTML = '<option value="new">مسيرة جديدة</option>';
 return;
 }
 card.style.display = "block";

 const prevValue = selector.value;
 selector.innerHTML = '<option value="new">مسيرة جديدة</option>' +
 characters.map((c, i) => `<option value="${i}">${c.marchName}</option>`).join('');

 const stillExists = editingIndex !== null && [...selector.options].some(o =>o.value === String(editingIndex));
 selector.value = stillExists ? editingIndex : (
 [...selector.options].some(o =>o.value === prevValue) ? prevValue : "new"
 );

 document.getElementById('deleteEditSelectedBtn').style.display = (selector.value === "new") ? "none" : "inline-block";
}

function onEditSelectorChange() {
 const val = document.getElementById('editSelector').value;
 document.getElementById('deleteEditSelectedBtn').style.display = (val === "new") ? "none" : "inline-block";
 if (val === "new") {
 cancelEdit();
 } else {
 editCharacter(parseInt(val, 10));
 }
}
