<script>
  // Local-storage backed polyfill matching the window.storage API used inside the app
  window.storage = {
    get: async function(key) {
      var v = localStorage.getItem('masirati:' + key);
      if (v === null) return null;
      return { key: key, value: v };
    },
    set: async function(key, value) {
      localStorage.setItem('masirati:' + key, value);
      return { key: key, value: value };
    },
    delete: async function(key) {
      localStorage.removeItem('masirati:' + key);
      return { key: key, deleted: true };
    },
    list: async function(prefix) {
      var keys = [];
      for (var i = 0; i < localStorage.length; i++) {
        var k = localStorage.key(i);
        if (k.indexOf('masirati:' + (prefix || '')) === 0) keys.push(k.replace('masirati:', ''));
      }
      return { keys: keys };
    }
  };
</script>

function defaultLeaderData() {

function LeaderPicker({ value, onChange, label, leaderData, onLeaderDataChange }) {
  const info = leaderData[value] || { damageType: '', coefficient: 0 };
  return (
    <div>
      <label style={styles.label}>{label}</label>
      <div style={{ display: 'flex', gap: '8px', alignItems: 'center' }}>
        {LEADER_IMAGES[value] && (
          <div style={{ position: 'relative', flexShrink: 0 }}>
            <img src={LEADER_IMAGES[value]} alt={value} style={{ width: '36px', height: '36px', clipPath: 'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)', objectFit: 'cover' }} />
            {LEADER_GROUP_ICONS[LEADER_TO_GROUP[value]] && (
              <img src={LEADER_GROUP_ICONS[LEADER_TO_GROUP[value]]} alt="" style={{ position: 'absolute', bottom: '-4px', left: '-4px', width: '16px', height: '16px' }} />
            )}
          </div>
        )}
        <select style={{ ...styles.input, flex: 1 }} value={value} onChange={(e) => onChange(e.target.value)}>
          <option value="">اختر القائد</option>
          {LEADER_GROUPS.map((g) => (
            <optgroup key={g.label} label={g.label}>
              {g.names.map((n) => <option key={n} value={n}>{n}</option>)}
            </optgroup>
          ))}
        </select>
      </div>
      {value && (
        <div style={{ display: 'flex', gap: '6px', marginTop: '6px' }}>
          <select style={{ ...styles.input, flex: 2 }} value={info.damageType}
            onChange={(e) => onLeaderDataChange(value, { ...info, damageType: e.target.value })}>
            <option value="">نوع الضرر</option>
            {LEADER_DAMAGE_TYPES.map((t) => <option key={t.key} value={t.key}>{t.label}</option>)}
          </select>
          <input type="number" style={{ ...styles.input, flex: 1 }} value={info.coefficient === 0 ? '' : info.coefficient} placeholder="المعامل"
            onFocus={(e) => e.target.select()}
            onChange={(e) => onLeaderDataChange(value, { ...info, coefficient: parseFloat(e.target.value) || 0 })} />
        </div>
      )}
    </div>
  );
}

function MarchPage({ data, setData, onSave, savedAt, leaderData, onLeaderDataChange, marchHistory, editingMarchIndex, setEditingMarchIndex }) {
  const update = (patch) => setData((d) => ({ ...d, ...patch }));

  const resetMarch = () => {
    setData({ leader1: '', leader2: '', equip: emptyEquip(), weapon: emptyWeapon(), formation: '', formationDamage: emptyFormationDamage(), selectedInscriptions: [] });
    setEditingMarchIndex(null);
  };

  const loadSavedMarch = (indexStr) => {
    if (indexStr === '') return;
    const idx = parseInt(indexStr, 10);
    const entry = marchHistory[idx];
    if (entry) {
      const { _savedAt, ...rest } = entry;
      setData({
        ...rest,
        equip: { ...emptyEquip(), ...(rest.equip || {}) },
        weapon: { ...emptyWeapon(), ...(rest.weapon || {}) },
        formationDamage: { ...emptyFormationDamage(), ...(rest.formationDamage || {}) },
      });
      setEditingMarchIndex(idx);
    }
  };

  const chooseFormation = (key) => {
    const dmg = emptyFormationDamage();
    if (FORMATIONS[key]) dmg[FORMATIONS[key].type] = FORMATIONS[key].value;
    update({ formation: key, selectedInscriptions: [], formationDamage: dmg });
  };

  const toggleInscription = (item) => {
    setData((d) => {
      const exists = d.selectedInscriptions.find((i) => i.name === item.name);
      return { ...d, selectedInscriptions: exists ? d.selectedInscriptions.filter((i) => i.name !== item.name) : [...d.selectedInscriptions, item] };
    });
  };

  const items = data.formation ? FORMATION_INSCRIPTIONS[data.formation].slice().sort((a, b) => TIER_ORDER[a.tier] - TIER_ORDER[b.tier]) : [];
  const selectedNames = new Set(data.selectedInscriptions.map((i) => i.name));

  return (
    <div>
      <div style={styles.card}>
        <div style={styles.cardTitle}>مسيرة جديدة أو تعديل محفوظة</div>
        <div style={styles.grid2}>
          <button
            style={{ padding: '10px', borderRadius: '8px', border: '1px solid #262626', cursor: 'pointer', background: '#0a0a0a', color: '#999999', fontSize: '13px' }}
            onClick={resetMarch}
          >
            مسيرة جديدة (تفريغ الحقول)
          </button>
          <select style={styles.input} value="" onChange={(e) => loadSavedMarch(e.target.value)}>
            <option value="">تعديل مسيرة محفوظة...</option>
            {(marchHistory || []).map((entry, i) => (
              <option key={i} value={i}>
                {(entry.leader1 || '—') + ' / ' + (entry.leader2 || '—') + ' — ' + (entry._savedAt ? new Date(entry._savedAt).toLocaleString('ar') : '')}
              </option>
            ))}
          </select>
        </div>
        {editingMarchIndex !== null && (
          <div style={{ color: '#f2994a', fontSize: '12px', marginTop: '8px' }}>
            وضع التعديل: أي حفظ الحين يحدّث نفس المسيرة المحفوظة (مو نسخة جديدة)
          </div>
        )}
      </div>

      <div style={styles.card}>
        <div style={styles.cardTitle}>القادة</div>
        <div style={styles.grid2}>
          <LeaderPicker label="القائد الأساسي" value={data.leader1} onChange={(v) => update({ leader1: v })} leaderData={leaderData} onLeaderDataChange={onLeaderDataChange} />
          <LeaderPicker label="القائد الثانوي" value={data.leader2} onChange={(v) => update({ leader2: v })} leaderData={leaderData} onLeaderDataChange={onLeaderDataChange} />
        </div>
      </div>

      <EquipBlock stats={data.equip} onChange={(v) => update({ equip: v })} />

      <div style={styles.card}>
        <div style={styles.cardTitle}>التشكيل</div>
        <label style={styles.label}>نوع التشكيل</label>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: '8px' }}>
          {Object.entries(FORMATIONS).map(([k, f]) => (
            <div
              key={k}
              onClick={() => chooseFormation(k)}
              style={{
                display: 'flex', flexDirection: 'column', alignItems: 'center', gap: '4px',
                background: data.formation === k ? '#0a0a0a' : 'transparent',
                border: data.formation === k ? '2px solid #f2994a' : '1px solid #262626',
                borderRadius: '10px', padding: '8px 4px', cursor: 'pointer',

function reportTotals(report) {
  const totals = Object.fromEntries(TYPES.map((t) => [t.key, 0]));
  const customTotals = {};
  (report.buffs || []).forEach((b) => {
    if (b.type === 'custom' && b.customLabel) {
      customTotals[b.customLabel] = (customTotals[b.customLabel] || 0) + b.value;
    } else if (b.type) {
      applyTypedAmount(totals, b.type, b.value);
    }
  });
  const baseStats = ['atk', 'def', 'hp'].map((k) => ({
    key: k,
    label: { atk: 'هجوم الوحدات', def: 'دفاع الوحدات', hp: 'صحة الوحدات' }[k],
    value: report.troopStats?.[k] || 0,
  }));
  return { damageTotals: totals, customTotals, baseStats };
}

function ReportSummary({ data }) {
  const { damageTotals, customTotals, baseStats } = reportTotals(data);
  const nonZeroStats = baseStats.filter((s) => s.value !== 0);
  const damageList = TYPES.filter((t) => t.key !== 'total')
    .map((t) => ({ label: t.label, value: Math.round(damageTotals[t.key] * 100) / 100 }))
    .concat(Object.entries(customTotals).map(([label, value]) => ({ label, value: Math.round(value * 100) / 100 })))
    .filter((d) => d.value !== 0)
    .sort((a, b) => b.value - a.value);

  if (nonZeroStats.length === 0 && damageList.length === 0 && totalDmg === 0) {

          <div style={styles.subTitle}>إجمالي إحصائيات الوحدات</div>

function applyTypedAmount(bucket, type, value) {
  if (bucket[type] !== undefined) {
    bucket[type] += value;
  }
}

function marchTotals(march, leaderData = {}) {
  const eq = march.equip || {};
  const wp = march.weapon || {};
  const fd = march.formationDamage || {};

  const totals = Object.fromEntries(TYPES.map((t) => [t.key, 0]));
  totals.skill += fd.skill || 0;
  totals.normal += fd.normal || 0;
  totals.finish += fd.finish || 0;
  totals.rally += fd.rally || 0;
  applyTypedAmount(totals, 'total', (eq.totalDmg || 0) + (eq.genTotalDmg || 0) + (eq.traitTotalDmg || 0) + (wp.totalDmg || 0));
  (march.selectedInscriptions || []).forEach((item) => {
    applyTypedAmount(totals, item.primary.type, item.primary.value);
    if (item.secondary) applyTypedAmount(totals, item.secondary.type, item.secondary.value);
  });

  const inscripTotal = (march.selectedInscriptions || []).reduce((s, item) => s + item.primary.value + (item.secondary ? item.secondary.value : 0), 0);
  const formationTotal = (fd.skill || 0) + (fd.normal || 0) + (fd.finish || 0) + (fd.rally || 0);

  const baseStats = [
    { key: 'atk', label: 'ATK', value: (eq.atk || 0) + (eq.genAtk || 0) + (eq.traitAtk || 0) + (wp.atk || 0) + formationTotal + inscripTotal },
    { key: 'def', label: 'DEF', value: (eq.def || 0) + (eq.genDef || 0) + (eq.traitDef || 0) + (wp.def || 0) },
    { key: 'hp', label: 'HP', value: (eq.hp || 0) + (eq.genHp || 0) + (eq.traitHp || 0) + (wp.hp || 0) },
    { key: 'spd', label: 'SPD', value: (eq.spd || 0) + (eq.genSpd || 0) + (eq.traitSpd || 0) + (wp.spd || 0) },
  ];

  const inscripTotalTagged = (march.selectedInscriptions || []).reduce((s, item) => {
    let v = 0;
    if (item.primary.type === 'total') v += item.primary.value;
    if (item.secondary && item.secondary.type === 'total') v += item.secondary.value;
    return s + v;
  }, 0);
  const totalDamageBreakdown = [
    { label: 'خصائص المعدات (الضرر الكلي)', value: eq.totalDmg || 0 },
    { label: 'ضبط التأثيرات (الضرر الكلي)', value: eq.genTotalDmg || 0 },
    { label: 'السمات المتميزة (الضرر الكلي)', value: eq.traitTotalDmg || 0 },
    { label: 'الأسلحة (الضرر الكلي)', value: wp.totalDmg || 0 },
    { label: 'نقوش مصنّفة ضرر كلي', value: inscripTotalTagged },
  ];

  const statBreakdowns = {
    atk: [
      { label: 'خصائص المعدات', value: eq.atk || 0 },
      { label: 'ضبط التأثيرات (معدات)', value: eq.genAtk || 0 },
      { label: 'سمات متميزة (معدات)', value: eq.traitAtk || 0 },
      { label: 'الأسلحة', value: wp.atk || 0 },
      { label: 'التشكيل', value: formationTotal },
      { label: 'النقوش', value: inscripTotal },
    ],
    def: [
      { label: 'خصائص المعدات', value: eq.def || 0 },
      { label: 'ضبط التأثيرات (معدات)', value: eq.genDef || 0 },
      { label: 'سمات متميزة (معدات)', value: eq.traitDef || 0 },
      { label: 'الأسلحة', value: wp.def || 0 },
    ],
    hp: [
      { label: 'خصائص المعدات', value: eq.hp || 0 },
      { label: 'ضبط التأثيرات (معدات)', value: eq.genHp || 0 },
      { label: 'سمات متميزة (معدات)', value: eq.traitHp || 0 },
      { label: 'الأسلحة', value: wp.hp || 0 },
    ],
    spd: [
      { label: 'خصائص المعدات', value: eq.spd || 0 },
      { label: 'ضبط التأثيرات (معدات)', value: eq.genSpd || 0 },
      { label: 'السمات المتميزة (معدات)', value: eq.traitSpd || 0 },
      { label: 'الأسلحة', value: wp.spd || 0 },
    ],
  };

  const sources = [
    { key: 'equip', label: 'المعدات', value: (eq.atk || 0) + (eq.genAtk || 0) + (eq.traitAtk || 0) },
    { key: 'weapon', label: 'الأسلحة', value: wp.atk || 0 },
    { key: 'formation', label: 'التشكيل', value: formationTotal },
    { key: 'inscriptions', label: 'النقوش', value: inscripTotal },
  ];

  return { baseStats, damageTotals: totals, sources, totalDamageBreakdown, statBreakdowns };
}

const PRIORITY_TYPES = ['skill', 'finish', 'rally'];
const NEXT_TYPES = ['normal', 'counter'];
function orderDamageList(list) {
  const byKey = Object.fromEntries(list.map((d) => [d.key, d]));
  const ordered = [];
  PRIORITY_TYPES.map((k) => byKey[k]).filter(Boolean).sort((a, b) => b.value - a.value).forEach((d) => ordered.push(d));
  NEXT_TYPES.map((k) => byKey[k]).filter(Boolean).forEach((d) => ordered.push(d));
  const usedKeys = new Set(PRIORITY_TYPES.concat(NEXT_TYPES));
  list.filter((d) => !usedKeys.has(d.key)).sort((a, b) => b.value - a.value).forEach((d) => ordered.push(d));
  return ordered;
}

function computeMaxima(history, totalsFn, extraArg) {
  const maxMap = {};
  history.forEach((entry) => {
    const { damageTotals, baseStats } = totalsFn(entry, extraArg);
    Object.entries(damageTotals || {}).forEach(([k, v]) => { maxMap[k] = Math.max(maxMap[k] || 0, v); });
    (baseStats || []).forEach((s) => { maxMap[s.key] = Math.max(maxMap[s.key] || 0, s.value); });
  });
  return maxMap;
}

function colorForRatio(ratio) {
  if (ratio < 0.4) return '#e34948';
  if (ratio < 0.75) return '#eda100';
  return '#1baf7a';
}

        }}>
          {LEADER_IMAGES[entry.leader1] ? (
            <img src={LEADER_IMAGES[entry.leader1]} alt={entry.leader1} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          ) : (
            <span style={{ color: '#555555', fontSize: '16px' }}>?</span>
          )}
        </div>
        <div style={{
          width: '34px', height: '34px', clipPath: 'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)',
          background: LEADER_IMAGES[entry.leader2] ? 'transparent' : '#262626',
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          marginRight: '-12px', zIndex: 1, position: 'relative',
        }}>
          {LEADER_IMAGES[entry.leader2] ? (
            <img src={LEADER_IMAGES[entry.leader2]} alt={entry.leader2} style={{ width: '100%', height: '100%', objectFit: 'cover' }} />
          ) : (
            <span style={{ color: '#555555', fontSize: '13px' }}>?</span>
          )}
        </div>
      </div>
      <div style={{ textAlign: 'center' }}>
        <div style={{ color: '#ffffff', fontSize: '13px', fontWeight: 500 }}>{entry.leader1 || 'بدون قائد'}</div>
        {entry.leader2 && <div style={{ color: '#888888', fontSize: '11px' }}>{entry.leader2}</div>}
      </div>
      {(formationName || troopTypeName) && (
        <div style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
          {source === 'march' && FORMATION_ICONS[entry.formation] && (
            <img src={FORMATION_ICONS[entry.formation]} alt={formationName} style={{ width: '20px', height: '20px' }} />
          )}
          {source === 'report' && TROOP_ICONS[entry.troopType] && (
            <img src={TROOP_ICONS[entry.troopType]} alt={troopTypeName} style={{ width: '20px', height: '20px' }} />
          )}
        </div>
      )}
      {badges.length > 0 && (
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '4px', justifyContent: 'center' }}>
          {badges.map((b) => (
            <span key={b.name} style={{ ...TIER_STYLE[b.tier], fontSize: '9px', fontWeight: 700, padding: '3px 6px', borderRadius: '999px' }}>{b.name}</span>
          ))}
        </div>
      )}
      {quickStats.length > 0 && (
        <div style={{ width: '100%', borderTop: '1px solid #262626', marginTop: '4px', paddingTop: '6px', display: 'flex', flexDirection: 'column', gap: '3px' }}>
          {quickStats.map((s) => (
            <div key={s.key} style={{ display: 'flex', justifyContent: 'space-between', fontSize: '11px' }}>
              <span style={{ color: '#999999' }}>{s.label}</span>
              <span style={{ color: '#f2994a' }}>{s.value}%</span>
            </div>
          ))}
        </div>
      )}
      <div style={{ fontSize: '10px', color: '#888888', marginTop: '2px' }}>{label}</div>
    </div>
  );
}

function Dashboard({ march, report, leaderData, marchHistory, reportHistory, onRefresh }) {
  const [source, setSource] = useState('march');
  const [selected, setSelected] = useState([]);
  const [leaderFilter, setLeaderFilter] = useState('all');
  const [troopTypeFilter, setTroopTypeFilter] = useState('all');
  const [compareMode, setCompareMode] = useState(false);

  const totalsFn = source === 'march' ? marchTotals : reportTotals;
  const extraArg = source === 'march' ? leaderData : undefined;
  const currentEntry = source === 'march' ? march : report;
  const history = source === 'march' ? marchHistory : reportHistory;
  const lastSaved = history[history.length - 1];
  const isUnchangedSinceLastSave = lastSaved && JSON.stringify({ ...lastSaved, _savedAt: null }) === JSON.stringify({ ...currentEntry, _savedAt: null });
  const allEntries = isUnchangedSinceLastSave ? history : history.concat([{ ...currentEntry, _savedAt: null }]);
  const maxMap = computeMaxima(allEntries, totalsFn, extraArg);

  const leaderKey = (entry) => (entry.leader1 || '—') + ' / ' + (entry.leader2 || '—');
  const leaderGroups = Array.from(new Set(allEntries.map(leaderKey)));

  const entryOptions = allEntries
    .map((entry, i) => ({
      index: i,
      leaderLabel: leaderKey(entry),
      leader1: entry.leader1,
      leader2: entry.leader2,
      troopType: entry.troopType || null,
      label: (entry._savedAt
        ? `${leaderKey(entry)} — ${new Date(entry._savedAt).toLocaleString('ar')}`
        : `${leaderKey(entry)} — الحالي (غير محفوظ)`),
    }))
    .filter((o) => leaderFilter === 'all' || o.leaderLabel === leaderFilter)
    .filter((o) => source !== 'report' || troopTypeFilter === 'all' || o.troopType === troopTypeFilter)
    .reverse();

  function buildChartRows(entry) {
    const { damageTotals, baseStats } = totalsFn(entry, extraArg);
    const rows = orderDamageList(
      TYPES.filter((t) => t.key !== 'total')
        .map((t) => ({ key: t.key, label: t.label, value: Math.round(damageTotals[t.key] * 100) / 100 }))
        .filter((d) => d.value !== 0)
    ).concat(
      (baseStats || []).filter((s) => s.value !== 0).map((s) => ({ key: s.key, label: s.label, value: Math.round(s.value * 100) / 100 }))
    );
    const totalDmg = Math.round(damageTotals.total * 100) / 100;
    if (totalDmg !== 0) rows.push({ key: 'total', label: 'الضرر الكلي', value: totalDmg });
    return rows;
  }

  const toggleSelect = (index) => {
    setSelected((prev) => (prev.includes(index) ? prev.filter((i) => i !== index) : prev.concat([index]).slice(-5)));
  };

  function renderSingleEntryChart(entry) {
    const rows = buildChartRows(entry).map((d) => {
      const max = maxMap[d.key] || 0;
      const ratio = max > 0 ? Math.min(d.value / max, 1) : 0;
      return { ...d, ratioPct: Math.round(ratio * 1000) / 10 };
    });
    if (rows.length === 0) return <div style={{ fontSize: '13px', color: '#888888' }}>لا توجد بيانات مدخلة بهذه النسخة</div>;
    return (
      <div style={{ width: '100%', height: Math.max(rows.length * 40, 120) }}>
        <ResponsiveContainer>
          <BarChart data={rows} layout="vertical" margin={{ left: 10, right: 30 }}>
            <XAxis type="number" hide domain={[0, 100]} />
            <YAxis type="category" dataKey="label" width={140} tick={{ fill: '#e8e8e6', fontSize: 12 }} axisLine={false} tickLine={false} />
            <Bar dataKey="ratioPct" radius={[0, 4, 4, 0]}>
              <LabelList dataKey="value" position="right" formatter={(v) => `${v}%`} fill="#ffffff" fontSize={13} />
              {rows.map((d, i) => <Cell key={i} fill={colorForRatio(d.ratioPct / 100)} />)}
            </Bar>
          </BarChart>
        </ResponsiveContainer>
      </div>
    );
  }

  let content;
  if (selected.length === 0) {
    content = <div style={{ fontSize: '13px', color: '#888888', padding: '12px 0' }}>اختر مسيرة أو تقرير واحد على الأقل لعرضه</div>;
  } else if (selected.length === 1) {
    content = renderSingleEntryChart(allEntries[selected[0]]);
  } else if (!compareMode) {
    content = (
      <div style={{ display: 'flex', flexDirection: 'column', gap: '18px' }}>
        {selected.map((idx) => (
          <div key={idx}>
            <div style={{ fontSize: '13px', color: '#f2994a', marginBottom: '6px' }}>{entryOptions.find((o) => o.index === idx)?.label}</div>
            {renderSingleEntryChart(allEntries[idx])}
          </div>
        ))}
      </div>
    );
  } else {
    const seriesColors = ['#7f9fd6', '#eda100', '#1baf7a', '#e34948', '#a97fd6'];
    const allKeys = [];
    const seen = new Set();
    selected.forEach((idx) => {
      buildChartRows(allEntries[idx]).forEach((d) => {
        if (!seen.has(d.key)) { seen.add(d.key); allKeys.push(d); }
      });
    });
    const merged = allKeys.map((k) => {
      const row = { label: k.label };
      selected.forEach((idx, si) => {
        const rows = buildChartRows(allEntries[idx]);
        const found = rows.find((r) => r.key === k.key);
        row['s' + si] = found ? found.value : 0;
      });
      return row;
    });
    content = (
      <div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: '10px', marginBottom: '10px', fontSize: '12px', color: '#999999' }}>
          {selected.map((idx, si) => (
            <span key={idx} style={{ display: 'flex', alignItems: 'center', gap: '4px' }}>
              <span style={{ width: '10px', height: '10px', borderRadius: '2px', background: seriesColors[si % seriesColors.length] }}></span>
              {entryOptions.find((o) => o.index === idx)?.label}
            </span>
          ))}
        </div>
        <div style={{ width: '100%', height: Math.max(merged.length * 50, 150) }}>
          <ResponsiveContainer>
            <BarChart data={merged} layout="vertical" margin={{ left: 10, right: 30 }}>
              <XAxis type="number" hide />
              <YAxis type="category" dataKey="label" width={140} tick={{ fill: '#e8e8e6', fontSize: 12 }} axisLine={false} tickLine={false} />
              {selected.map((idx, si) => (
                <Bar key={si} dataKey={'s' + si} fill={seriesColors[si % seriesColors.length]} radius={[0, 4, 4, 0]}>
                  <LabelList dataKey={'s' + si} position="right" formatter={(v) => `${v}%`} fill="#ffffff" fontSize={11} />
                </Bar>
              ))}
            </BarChart>
          </ResponsiveContainer>
        </div>
      </div>
    );
  }

  const heroLeaderName = leaderFilter !== 'all' ? leaderFilter.split(' / ').find((name) => LEADER_HERO_IMAGES[name]) : null;

  return (
    <div>
      <div style={styles.card}>
        <div style={{ display: 'flex', gap: '8px', marginBottom: '10px' }}>
          <button style={{ flex: 1, padding: '8px', borderRadius: '8px', border: '1px solid #262626', cursor: 'pointer', background: source === 'march' ? '#f2994a' : '#0a0a0a', color: source === 'march' ? '#2a1400' : '#999999' }} onClick={() => { setSource('march'); setSelected([]); }}>المسيرة</button>
          <button style={{ flex: 1, padding: '8px', borderRadius: '8px', border: '1px solid #262626', cursor: 'pointer', background: source === 'report' ? '#f2994a' : '#0a0a0a', color: source === 'report' ? '#2a1400' : '#999999' }} onClick={() => { setSource('report'); setSelected([]); }}>التقرير</button>
        </div>
        <label style={styles.label}>القائد الأساسي / الثانوي</label>
        <select style={{ ...styles.input, marginBottom: '10px' }} value={leaderFilter} onChange={(e) => { setLeaderFilter(e.target.value); setSelected([]); }}>
          <option value="all">كل القادة</option>
          {leaderGroups.map((g) => <option key={g} value={g}>{g}</option>)}
        </select>
        {source === 'report' && (
          <>
            <label style={styles.label}>نوع الوحدات</label>
            <select style={{ ...styles.input, marginBottom: '10px' }} value={troopTypeFilter} onChange={(e) => { setTroopTypeFilter(e.target.value); setSelected([]); }}>
              <option value="all">كل الأنواع</option>
              {TROOP_TYPES.map((t) => <option key={t.key} value={t.key}>{t.name}</option>)}
            </select>
          </>
        )}
        {leaderFilter !== 'all' && (
          <div style={{ display: 'flex', gap: '10px', marginBottom: '10px' }}>
            {leaderFilter.split(' / ').map((name) => LEADER_IMAGES[name] && (
              <div key={name} style={{ display: 'flex', alignItems: 'center', gap: '6px' }}>
                <img src={LEADER_IMAGES[name]} alt={name} style={{ width: '32px', height: '32px', clipPath: 'polygon(25% 0,75% 0,100% 50%,75% 100%,25% 100%,0 50%)', objectFit: 'cover' }} />
                <span style={{ fontSize: '12px', color: '#999999' }}>{name}</span>
              </div>
            ))}
          </div>
        )}
        <div style={styles.subTitle}>اختر نسخة أو أكثر (حتى 5) للمقارنة</div>
        <div style={{ display: 'grid', gridTemplateColumns: 'repeat(2, 1fr)', gap: '10px', maxHeight: '420px', overflowY: 'auto', paddingBottom: '4px' }}>
          {entryOptions.map((o) => {
            const entry = allEntries[o.index];
            const quickStats = buildChartRows(entry);
            return (
              <EntryCard
                key={o.index}
                entry={entry}
                label={o.label}
                selected={selected.includes(o.index)}
                onToggle={() => toggleSelect(o.index)}
                quickStats={quickStats}
                source={source}
              />
            );
          })}
        </div>
        {selected.length > 1 && (
          <button
            style={{ width: '100%', marginTop: '10px', padding: '10px', borderRadius: '8px', border: '1px solid #262626', cursor: 'pointer', background: compareMode ? '#f2994a' : '#0a0a0a', color: compareMode ? '#2a1400' : '#999999' }}
            onClick={() => setCompareMode((v) => !v)}
          >
            {compareMode ? 'إلغاء المقارنة' : 'قارن بينهم'}
          </button>
        )}
      </div>

      <div style={{ ...styles.card, display: 'flex', gap: '12px', alignItems: 'flex-start' }}>
        <div style={{ flex: 1, minWidth: 0 }}>{content}</div>
        {heroLeaderName && (
          <img src={LEADER_HERO_IMAGES[heroLeaderName]} alt={heroLeaderName} style={{ width: '110px', borderRadius: '10px', flexShrink: 0, objectFit: 'cover' }} />
        )}
      </div>

      <button style={{ ...styles.saveBtn, background: '#262626', color: '#ffffff' }} onClick={onRefresh}>تحديث من الصفحتين</button>
    </div>
  );
}
function App() {
  const [tab, setTab] = useState('march');
  const [march, setMarch] = useState({ leader1: '', leader2: '', equip: emptyEquip(), weapon: emptyWeapon(), formation: '', formationDamage: emptyFormationDamage(), selectedInscriptions: [] });
  const [editingMarchIndex, setEditingMarchIndex] = useState(null);
  const [report, setReport] = useState({ leader1: '', leader2: '', troopType: '', troopStats: emptyTroopStats(), buffs: [] });
  const [leaderData, setLeaderData] = useState(defaultLeaderData());
  const [marchHistory, setMarchHistory] = useState([]);
  const [reportHistory, setReportHistory] = useState([]);
  const [marchSavedAt, setMarchSavedAt] = useState(null);
  const [reportSavedAt, setReportSavedAt] = useState(null);
  const [loaded, setLoaded] = useState(false);

  const load = useCallback(async () => {
    try {
      const m = await window.storage.get('march-data-v2');
      if (m) {
        const parsed = JSON.parse(m.value);
        setMarch((prev) => ({
          ...prev,
          ...parsed,
          equip: { ...emptyEquip(), ...(parsed.equip || {}) },
          weapon: { ...emptyWeapon(), ...(parsed.weapon || {}) },
          formationDamage: { ...emptyFormationDamage(), ...(parsed.formationDamage || {}) },
        }));
      }
    } catch (e) {}
    try {
      const r = await window.storage.get('report-data-v2');
      if (r) {
        const parsed = JSON.parse(r.value);
        setReport((prev) => ({ ...prev, ...parsed, troopStats: { ...emptyTroopStats(), ...(parsed.troopStats || {}) } }));
      }
    } catch (e) {}
    try {
      const l = await window.storage.get('leader-data-v1');
      if (l) setLeaderData((prev) => ({ ...prev, ...JSON.parse(l.value) }));
    } catch (e) {}
    try {
      const mh = await window.storage.get('march-history-v1');
      if (mh) setMarchHistory(JSON.parse(mh.value));
    } catch (e) {}
    try {
      const rh = await window.storage.get('report-history-v1');
      if (rh) setReportHistory(JSON.parse(rh.value));
    } catch (e) {}
    setLoaded(true);
  }, []);

  useEffect(() => { load(); }, [load]);

  const saveMarch = async () => {
    let nextHistory;
    if (editingMarchIndex !== null && marchHistory[editingMarchIndex]) {
      nextHistory = marchHistory.map((entry, i) => (i === editingMarchIndex ? { ...march, _savedAt: new Date().toISOString() } : entry));
    } else {
      nextHistory = marchHistory.concat([{ ...march, _savedAt: new Date().toISOString() }]).slice(-50);
      setEditingMarchIndex(nextHistory.length - 1);
    }
    setMarchHistory(nextHistory);
    setMarchSavedAt(new Date().toLocaleTimeString('ar'));
    try {
      await window.storage.set('march-data-v2', JSON.stringify(march));
      await window.storage.set('march-history-v1', JSON.stringify(nextHistory));
    } catch (e) {}
  };

  const saveReport = async () => {
    const nextHistory = reportHistory.concat([{ ...report, _savedAt: new Date().toISOString() }]).slice(-50);
    setReportHistory(nextHistory);
    setReportSavedAt(new Date().toLocaleTimeString('ar'));
    try {
      await window.storage.set('report-data-v2', JSON.stringify(report));
      await window.storage.set('report-history-v1', JSON.stringify(nextHistory));
    } catch (e) {}
  };

  const updateLeaderData = (name, info) => {
    setLeaderData((prev) => {
      const next = { ...prev, [name]: info };
      window.storage.set('leader-data-v1', JSON.stringify(next)).catch(() => {});
      return next;
    });
  };

  if (!loaded) return <div style={styles.page}>جارِ التحميل...</div>;

  return (
    <div style={styles.page}>
      <div style={styles.tabs}>
        <div style={styles.tab(tab === 'march')} onClick={() => setTab('march')}>صفحة المسيرة</div>
        <div style={styles.tab(tab === 'report')} onClick={() => setTab('report')}>صفحة التقرير</div>
        <div style={styles.tab(tab === 'dashboard')} onClick={() => setTab('dashboard')}>الداشبورد</div>
      </div>

      {tab === 'march' && <MarchPage data={march} setData={setMarch} onSave={saveMarch} savedAt={marchSavedAt} leaderData={leaderData} onLeaderDataChange={updateLeaderData} marchHistory={marchHistory} editingMarchIndex={editingMarchIndex} setEditingMarchIndex={setEditingMarchIndex} />}
      {tab === 'report' && <ReportPage data={report} setData={setReport} onSave={saveReport} savedAt={reportSavedAt} leaderData={leaderData} onLeaderDataChange={updateLeaderData} />}
      {tab === 'dashboard' && <Dashboard march={march} report={report} leaderData={leaderData} marchHistory={marchHistory} reportHistory={reportHistory} onRefresh={load} />}
    </div>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
</script>
</body>
</html>
